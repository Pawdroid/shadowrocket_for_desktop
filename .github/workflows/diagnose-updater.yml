name: Diagnose Windows updater
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/diagnose-updater.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: updater-diagnosis
          path: updater-diagnosis/*.log
