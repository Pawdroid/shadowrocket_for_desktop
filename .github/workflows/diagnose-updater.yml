name: Diagnose Windows updater
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Use the explicitly authorized temporary diagnostic helper
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/diagnose-updater.py ${{ inputs.diagnostic && '--diagnostic' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: updater-diagnosis
          path: updater-diagnosis/*.log
