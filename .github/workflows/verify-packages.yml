name: Verify release packages
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate release tag (empty only checks runner availability)
        required: false
        type: string
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, platform: windows, arch: x64, rid: win-x64 }
          - { runner: windows-11-arm, platform: windows, arch: arm64, rid: win-arm64 }
          - { runner: ubuntu-24.04, platform: linux, arch: x64, rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, rid: linux-arm64 }
          - { runner: macos-15-intel, platform: macos, arch: x64, rid: osx-x64 }
          - { runner: macos-15, platform: macos, arch: arm64, rid: osx-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Runner availability
        shell: bash
        run: |
          uname -a
          dotnet --info
      - name: Setup .NET for package checks
        if: inputs.candidate != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Install Linux GUI dependencies
        if: inputs.candidate != '' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool fonts-noto-cjk libicu74 libfontconfig1 libfreetype6 libx11-6 libice6 libsm6
      - name: Verify Windows and macOS install and upgrade
        if: inputs.candidate != '' && matrix.platform != 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-packages.py --candidate "${{ inputs.candidate }}" --rid "${{ matrix.rid }}"
      - name: Verify Linux install and upgrade
        if: inputs.candidate != '' && matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: xvfb-run -a python3 scripts/verify-packages.py --candidate "${{ inputs.candidate }}" --rid "${{ matrix.rid }}"
      - name: Save verification evidence
        if: always() && inputs.candidate != ''
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.rid }}
          path: |
            package-verification/results.json
            package-verification/*.log
          if-no-files-found: warn
